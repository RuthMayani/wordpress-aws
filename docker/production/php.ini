expose_php = Off
display_errors = Off
log_errors = On
error_log = /proc/self/fd/2

memory_limit = 256M
upload_max_filesize = 64M
post_max_size = 64M
max_execution_time = 120

openssl.cafile = /etc/ssl/certs/rds-ca.pem

opcache.enable = 1
opcache.memory_consumption = 128
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
